{% extends "base.html" %}

{% block title %}Add Doctor - Hospital Management System{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{{ url_for('doctors') }}">Doctors</a></li>
          <li class="breadcrumb-item active" aria-current="page">Add Doctor</li>
        </ol>
      </nav>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
          <h5 class="fw-bold mb-0 text-success">
            <i class="bi bi-person-badge-fill me-2"></i>Add New Doctor
          </h5>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('add_doctor') }}">
            <div class="row g-3">
              
              <!-- Doctor Name -->
              <div class="col-md-6">
                <label for="name" class="form-label fw-semibold">Doctor Name <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light">Dr.</span>
                  <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                </div>
              </div>

              <!-- Speciality -->
              <div class="col-md-6">
                <label for="speciality" class="form-label fw-semibold">Speciality <span class="text-danger">*</span></label>
                <select class="form-select" id="speciality" name="speciality" required>
                  <option value="" disabled selected>-- Select Speciality --</option>
                  <option value="General Physician">General Physician</option>
                  <option value="Cardiologist">Cardiologist</option>
                  <option value="Dermatologist">Dermatologist</option>
                  <option value="Orthopedic">Orthopedic</option>
                  <option value="Pediatrician">Pediatrician</option>
                  <option value="Neurologist">Neurologist</option>
                  <option value="ENT Specialist">ENT Specialist</option>
                  <option value="Gynecologist">Gynecologist</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <!-- Phone -->
              <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="e.g. 9876543210" required>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email" placeholder="e.g. doctor@hospital.com" required>
              </div>

              <!-- Consultation Fee -->
              <div class="col-md-6">
                <label for="consultation_fee" class="form-label fw-semibold">Consultation Fee (₹) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light">₹</span>
                  <input type="number" step="0.01" min="0" class="form-control" id="consultation_fee" name="consultation_fee" placeholder="e.g. 500.00" required>
                </div>
              </div>

              <!-- Available Days -->
              <div class="col-md-6">
                <label for="available_days" class="form-label fw-semibold">Available Days <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="available_days" name="available_days" placeholder="e.g. Mon - Fri, or Mon, Wed, Fri" required>
              </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
              <a href="{{ url_for('doctors') }}" class="btn btn-outline-secondary px-4">Cancel</a>
              <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-save me-1"></i> Save Doctor
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
