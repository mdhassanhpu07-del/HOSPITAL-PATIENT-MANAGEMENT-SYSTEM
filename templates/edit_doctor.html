{% extends "base.html" %}

{% block title %}Edit Doctor - Hospital Management System{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{{ url_for('doctors') }}">Doctors</a></li>
          <li class="breadcrumb-item active" aria-current="page">Edit Doctor</li>
        </ol>
      </nav>

      <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
          <h5 class="fw-bold mb-0 text-success">
            <i class="bi bi-pencil-square me-2"></i>Edit Doctor: {{ doctor.name }}
          </h5>
          <span class="badge bg-secondary">{{ doctor.doctor_id }}</span>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('edit_doctor', id=doctor.id) }}">
            <div class="row g-3">
              
              <!-- Doctor Name -->
              <div class="col-md-6">
                <label for="name" class="form-label fw-semibold">Doctor Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" name="name" value="{{ doctor.name }}" required>
              </div>

              <!-- Speciality -->
              <div class="col-md-6">
                <label for="speciality" class="form-label fw-semibold">Speciality <span class="text-danger">*</span></label>
                <select class="form-select" id="speciality" name="speciality" required>
                  {% for spec in ['General Physician', 'Cardiologist', 'Dermatologist', 'Orthopedic', 'Pediatrician', 'Neurologist', 'ENT Specialist', 'Gynecologist', 'Other'] %}
                    <option value="{{ spec }}" {% if doctor.speciality == spec %}selected{% endif %}>{{ spec }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- Phone -->
              <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{{ doctor.phone }}" required>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" name="email" value="{{ doctor.email }}" required>
              </div>

              <!-- Consultation Fee -->
              <div class="col-md-6">
                <label for="consultation_fee" class="form-label fw-semibold">Consultation Fee (₹) <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light">₹</span>
                  <input type="number" step="0.01" min="0" class="form-control" id="consultation_fee" name="consultation_fee" value="{{ doctor.consultation_fee }}" required>
                </div>
              </div>

              <!-- Available Days -->
              <div class="col-md-6">
                <label for="available_days" class="form-label fw-semibold">Available Days <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="available_days" name="available_days" value="{{ doctor.available_days }}" required>
              </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
              <a href="{{ url_for('doctors') }}" class="btn btn-outline-secondary px-4">Cancel</a>
              <button type="submit" class="btn btn-success px-4">
                <i class="bi bi-check-lg me-1"></i> Update Doctor
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
